<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Catat transaksi, atur budget bulanan, dan pahami arus kas pribadi Anda." />
    <link rel="preload" href="/fonts/manrope.ttf" as="font" type="font/ttf" crossorigin />
    <title>Personal Finance Tracker</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('finance_tracker_theme');
          var isDark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
